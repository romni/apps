apiVersion: apps/v1
name: history
repo: apps/history
# Sandbox grants: the CNPG cluster (platform-provisioned, lives in this
# namespace) needs the operator admitted and the barman/S3 lane out; the app
# itself sits behind the shared SSO proxy and talks to the AI gateway.
egress: [garage, litellm]
ingress: [sso-proxy, cnpg-status, cnpg-sql, prometheus-scrape]
pages: [history]
# Per-PR preview sandboxes: the factory stamps app-history-preview
# with the same default-deny + S quota + the -preview deploy identity; previews
# publish behind the shared SSO gate (label `preview` on a PR).
previews:
  enabled: true
  quotaTier: S

database:
  storage: 5Gi
  cpu: 50m
  memory: 384Mi
  serverName: history-db-v2
  barmanObjectName: garage-history
  backupSchedule: "0 45 4 * * *"

secrets:
  - name: history-litellm
    data:
      LITELLM_KEY: { env: LITELLM_HISTORY_KEY }
      LITELLM_BASE_URL: { value: "http://litellm.ai.svc.cluster.local:4000" }
  - name: history-env
    required: true
    adopt: true
    data:
      GEN_API_TOKEN: { env: HISTORY_GEN_API_TOKEN }

ssoProxy:
  host: history.apps
  upstream: http://history.app-history.svc.cluster.local:80
  skipAuthRoutes: "^/api/"
  cookieRefresh: 50m
  setXauthrequest: true

buckets:
  - bucket: history-materials
    secretName: history-materials-s3

pagesMeta:
  history: { icon: mdi-history, description: "Family-genealogy research template" }

