# owners.yaml — the registry trust root.
#
# `operators:` may approve OPERATOR-TIER changes (anything beyond a request-tier
# self-serve edit): new/deleted spec files, this file, workflows, schema refs,
# and security-tier fields (egress, sso, db/env secrets, repo, namespace,
# previews.enabled). The gate checks their APPROVED review — pinned to the PR
# head sha — via the Forgejo API.
#
# `apps:` maps each app to the user(s) allowed REQUEST-TIER self-merge of that
# app's own apps/<name>.yaml: quota bumps within the tier ladder, extra
# hostnames under the app's own prefix, cronjob/job counts within cap, LLM caps
# within the LLM ceilings, previews ttl/tier.
#
# owners.yaml is itself OPERATOR-TIER: editing this file is never self-merge.
# The gate runs base-ref (pull_request_target) so a PR head cannot spoof it.
#
# One agent identity does all app-agent work: `deep-one` (the renamed
# `rlyeh-agent`; the studio's separate `openchamber-agent` is collapsed into it,
# 2026-09-04). `rlyeh-agent` stays listed only until the Forgejo rename lands,
# then drops. The `# future:` comments mark the intended per-app identities.
operators: [romni, rlyeh-agent, deep-one]
apps:
  antipax: [rlyeh-agent, deep-one] # future: antipax-agent
  aniki: [rlyeh-agent, deep-one] # future: aniki-agent
  assessor: [rlyeh-agent, deep-one] # future: assessor-agent
  elabora: [rlyeh-agent, deep-one] # future: elabora-agent
  history: [rlyeh-agent, deep-one] # future: history-agent
  plugins: [rlyeh-agent, deep-one] # future: plugins-agent
  pretium: [rlyeh-agent, deep-one] # future: pretium-agent
  streamdeck: [rlyeh-agent, deep-one] # future: streamdeck-agent
  yith: [rlyeh-agent, deep-one] # future: yith-agent
