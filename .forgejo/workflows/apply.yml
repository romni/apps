# apply.yml — CI-owned apps apply (owner decision).
# A merge to main IS the grant taking effect: this job applies the apps Pulumi
# stack so a request-tier self-merge converges with zero operator action.
#
# CREDENTIAL POSTURE — no standing kube credential exists for this job:
#   - Cluster: a short-lived Forgejo Actions OIDC token minted PER RUN, which
#     the apiserver maps to User `forgejo-ci:repo:homelab/apps:ref:refs/heads/main`.
#     That user holds the `apps-applier` ClusterRole (app-plane kinds only,
#     bind fenced to admin/deploy-routes) and a ValidatingAdmissionPolicy
#     confines it to the `apps`/`app-*` namespaces at admission — it CANNOT
#     touch a platform namespace even where RBAC would allow the kind.
#   - Pulumi state: repo-level secrets (FLEET_STATE_* + APPS_PULUMI_PASSPHRASE,
#     delivered by `task forge`) scoped to the s3://apps-state bucket, which
#     holds ONLY this stack's state — never the platform state (cluster PKI).
#
# The apps PROGRAM comes from the platform repo's protected main (same trust
# root the gate uses for schema/catalog); the SPECS come from this checkout.
# `task apps:apply` on the host remains the manual/recovery path.
name: apply
enable-openid-connect: true
on:
  push:
    branches: [main]
  # Manual re-fire for recovery/debugging — applies exactly what main holds.
  workflow_dispatch:

jobs:
  apply:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Pinned tool binaries, warm-restored from the LAN cache (build-image
      # pattern). kubectl only builds the token-bearing kubeconfig; pulumi runs
      # the apply. Renovate bumps both pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/homelab-apps-tools
          key: apps-tools-v3.259.0-v1.36.4-${{ runner.os }}-${{ runner.arch }}
      - name: Install pulumi + kubectl
        env:
          # renovate: datasource=github-releases depName=pulumi/pulumi
          PULUMI_VERSION: v3.259.0
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: v1.36.4
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) ARCH=x64; KARCH=amd64 ;;
            aarch64) ARCH=arm64; KARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          cache="$HOME/.cache/homelab-apps-tools"
          mkdir -p "$cache"
          if [ ! -x "$cache/pulumi-$PULUMI_VERSION/pulumi" ]; then
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/pulumi.tgz \
              "https://get.pulumi.com/releases/sdk/pulumi-${PULUMI_VERSION}-linux-${ARCH}.tar.gz"
            mkdir -p "$cache/pulumi-$PULUMI_VERSION"
            tar -xzf /tmp/pulumi.tgz -C "$cache/pulumi-$PULUMI_VERSION" --strip-components=1
            rm -f /tmp/pulumi.tgz
          fi
          if [ ! -x "$cache/kubectl-$KUBECTL_VERSION" ]; then
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 -o "$cache/kubectl-$KUBECTL_VERSION" \
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KARCH}/kubectl"
            chmod +x "$cache/kubectl-$KUBECTL_VERSION"
          fi
          install -m755 "$cache/kubectl-$KUBECTL_VERSION" /usr/local/bin/kubectl
          for b in "$cache/pulumi-$PULUMI_VERSION"/*; do install -m755 "$b" "/usr/local/bin/$(basename "$b")"; done
          pulumi version && kubectl version --client=true
      - name: Fetch the apps program (platform repo @ main)
        run: |
          set -eu
          git clone --depth 1 --branch main "${GITHUB_SERVER_URL}/homelab/rlyeh.git" "$RUNNER_TEMP/rlyeh"
          echo "apps program @ $(git -C "$RUNNER_TEMP/rlyeh" rev-parse --short HEAD)"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ~/.pulumi/plugins
          key: apps-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: apps-npm-
      - name: Apply the apps stack
        env:
          KUBECONFIG_DATA: ${{ vars.DEPLOY_KUBECONFIG }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.APPS_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APPS_STATE_SECRET_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.APPS_PULUMI_PASSPHRASE }}
          GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Delegated LiteLLM keygen credential — a proxy_admin virtual key,
          # NOT the master key. Empty when unminted: the apps program then skips
          # LLM key minting entirely (hand-minted keys keep working).
          APPS_LITELLM_KEYGEN: ${{ secrets.LITELLM_KEYGEN_KEY }}
        run: |
          # Self-reporting: an unattended apply that fails must surface WHERE —
          # there is no run-log API on this Forgejo, so on failure the log tail
          # lands in a registry issue (secrets never echo: pulumi masks state
          # values, and this script prints no credential).
          log="$(mktemp)"
          on_fail() {
            code=$?
            tail -c 20000 "$log" || true
            python3 - "$log" <<'PYEOF' || true
          import json,os,sys,urllib.request
          body = "First 60k of the failed apply log:\n\n```\n" + open(sys.argv[1]).read()[-60000:] + "\n```"
          req = urllib.request.Request(
              os.environ["GITHUB_API_URL"].rstrip("/") + f"/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=json.dumps({"title": f"CI apps apply FAILED @ {os.environ['GITHUB_SHA'][:9]}", "body": body}).encode(),
              headers={"Authorization": "token " + os.environ["GATE_TOKEN"], "Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req, timeout=30)
          PYEOF
            exit "$code"
          }
          trap on_fail ERR
          exec > >(tee "$log") 2>&1
          set -eu
          # Token-bearing kubeconfig for THIS run (deploy-helm.yml pattern):
          # credential-less server+CA from the org var, OIDC token appended.
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          install -m600 /dev/null "$KUBECONFIG"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$KUBECONFIG"
          # python3, not jq: the bare docker-label image ships no jq (deploy-helm
          # gets its jq from the ci-deploy container; this job runs uncontainered).
          TOKEN="$(curl -fsSL "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=forgejo-ci" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          kubectl config set-credentials ci --token="$TOKEN"
          kubectl config set-context --current --user=ci

          cd "$RUNNER_TEMP/rlyeh/infra"
          npm ci --no-audit --no-fund
          cd apps
          export PULUMI_BACKEND_URL="s3://apps-state?endpoint=${S3_ENDPOINT}&s3ForcePathStyle=true&region=us-east-1"
          pulumi stack select apps
          # Point the program at THIS checkout's specs + the run's kubeconfig
          # (writes the scratch stack config in the ephemeral checkout only).
          pulumi config set apps:dir "$GITHUB_WORKSPACE"
          pulumi config set apps:kubeconfig "$KUBECONFIG"
          # Delegated keygen credential, guarded on non-empty. Set --secret
          # from stdin (never argv) so it is encrypted in the ephemeral checkout's
          # stack config — like apps:dir, it lives only for this run. Unset =>
          # the apps program skips LLM minting.
          if [ -n "${APPS_LITELLM_KEYGEN:-}" ]; then
            printf '%s' "$APPS_LITELLM_KEYGEN" | pulumi config set --secret apps:litellmKeygenKey
          fi
          # NO --refresh: the k8s provider persists its kubeconfig INPUT in state,
          # and this run's kubeconfig carries a minutes-lived OIDC token — a later
          # run's refresh would read live state with the PREVIOUS run's expired
          # token and 401 (observed live, runs 11912/11913). The apps stack fully
          # owns its resources, so apply-vs-state diffing suffices; drift healing
          # is a deliberate operator `pulumi refresh` with a durable credential.
          pulumi up --yes
          echo "apps applied @ registry $GITHUB_SHA"
      # Best-effort announce (deploy-helm.yml contract): never fails the job,
      # silently skips when the ci-bot secret is absent.
      - name: Announce on Zulip
        continue-on-error: true
        env:
          ZULIP_URL: ${{ vars.ZULIP_URL }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_CI_BOT_EMAIL }}
          ZULIP_KEY: ${{ secrets.ZULIP_CI_BOT_KEY }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "${ZULIP_EMAIL:-}" ] || [ -z "${ZULIP_KEY:-}" ] || [ -z "${ZULIP_URL:-}" ]; then
            echo "zulip ci-bot not configured — skipping announce"; exit 0
          fi
          sha7="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          subject="$(printf '%s' "$HEAD_MSG" | head -n1)"
          content="**apps** applied registry @ ${sha7} — ${subject}"
          curl -sf -u "${ZULIP_EMAIL}:${ZULIP_KEY}" -X POST "${ZULIP_URL}/api/v1/messages" \
            --data-urlencode type=stream --data-urlencode to=agents \
            --data-urlencode topic=releases --data-urlencode "content=${content}" \
            >/dev/null 2>&1 || echo "announce skipped (Zulip unreachable)" >&2
          exit 0
