# The registry's tiered approval gate — BASE-REF by design (pull_request_target,
# probed working + spoof-proof on Forgejo 15.0.5): this workflow always executes
# from the DEFAULT branch, so a PR cannot edit the gate that judges it. PR head
# content is only ever fetched as DATA (raw file at the head sha), never checked
# out or executed.
#
# Verdict rules (owners.yaml is the trust root):
#   REQUEST TIER (gate green, author self-merges):
#     - the diff touches EXACTLY one modified file, apps/<app>.yaml
#     - the PR author owns <app> per owners.yaml (base version)
#     - the head spec validates against the platform schema
#       (homelab/rlyeh raw: schema/appspec.json)
#     - every changed field is request-tier within the platform catalog's
#       bounds (homelab/rlyeh raw: infra/lib/apps-catalog.json)
#   OPERATOR TIER (anything else — new/deleted files, owners.yaml, workflows,
#   security-tier fields): passes ONLY with an APPROVED review, pinned to the
#   current head sha, from a user in owners.yaml `operators:`. Reviews do not
#   re-trigger workflows on this Forgejo — after approving, re-run the gate
#   from the UI or push an empty commit.
#
# Branch protection on this repo requires the single context:
#   gate / gate (pull_request_target)
name: gate
on:
  pull_request_target:

jobs:
  gate:
    runs-on: ram
    timeout-minutes: 10
    steps:
      # BASE checkout: trusted gate code + trusted owners.yaml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The gate is DEPENDENCY-FREE python (stdlib + the pinned yq binary for
      # YAML→JSON): the ram label image (node:<lts>-bookworm) ships python3 but
      # NO pip, so pyyaml/jsonschema installs are impossible — gate.py parses
      # YAML through yq and validates the schema with a built-in interpreter of
      # exactly the keyword subset appspec.json uses (it fails loudly if the
      # schema ever grows past that subset). Same pinned-yq install + LAN cache
      # as homelab/actions conformance.yml.
      # renovate: datasource=github-releases depName=mikefarah/yq
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/homelab-yq
          key: yq-v4.53.6-${{ runner.os }}-${{ runner.arch }}
      - name: Install yq
        env:
          YQ_VERSION: v4.53.6
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64)  ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *) echo "gate: unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          cache="$HOME/.cache/homelab-yq"
          mkdir -p "$cache"
          bin="$cache/yq-$YQ_VERSION-$ARCH"
          if [ ! -x "$bin" ]; then
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 -o "$bin" \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${ARCH}"
            chmod +x "$bin"
          fi
          install -m755 "$bin" /usr/local/bin/yq
          yq --version
      - name: Tiered approval check
        env:
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEMA_URL: ${{ github.server_url }}/homelab/rlyeh/raw/branch/main/schema/appspec.json
          CATALOG_URL: ${{ github.server_url }}/homelab/rlyeh/raw/branch/main/infra/lib/apps-catalog.json
        run: python3 .forgejo/scripts/gate.py
